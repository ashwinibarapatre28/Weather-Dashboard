<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-default">
  <div class="app-container">
    
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.42 0-.83.07-1.22.2A6 6 0 0 0 3 11.5c0 3.59 2.91 6.5 6.5 6.5h8" />
          <path d="M12 2v2M4.93 4.93l1.41 1.41M2 12h2M6.34 17.66l-1.41 1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <h1>Weather</h1>
      </div>

      <!-- Search Section -->
      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search city..." autocomplete="off">
          <button id="locate-btn" aria-label="Use Current Location">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            </svg>
          </button>
        </div>
        <!-- Autocomplete Suggestions -->
        <ul id="suggestions-list" class="suggestions-list hidden"></ul>
      </div>

      <!-- Controls -->
      <div class="controls-container">
        <div class="toggle-group">
          <button id="unit-c" class="unit-btn active">°C</button>
          <button id="unit-f" class="unit-btn">°F</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-grid">
      
      <!-- Left Column: Main Weather Stats -->
      <section class="main-stats-panel">
        <!-- Hero Weather Card -->
        <div id="hero-card" class="hero-card card">
          <div class="skeleton-glow skeleton-hero"></div>
          <div class="hero-content hidden">
            <div class="hero-top">
              <div class="location-info">
                <h2 id="city-name">Loading...</h2>
                <p id="current-date">--</p>
              </div>
              <button id="favorite-btn" class="fav-btn" aria-label="Add to favorites">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
            </div>
            <div class="hero-weather-details">
              <div class="temp-display">
                <span id="current-temp">--</span>
                <span class="temp-unit">°C</span>
              </div>
              <div class="weather-visual">
                <div id="hero-weather-icon" class="weather-icon-large"></div>
                <div id="weather-description" class="weather-desc">--</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Weather Stats Grid -->
        <div class="details-grid">
          <!-- Card 1: Feels Like -->
          <div class="detail-card card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
            </div>
            <div class="card-data">
              <span class="card-label">Feels Like</span>
              <span id="feels-like" class="card-value">--</span>
            </div>
          </div>
          <!-- Card 2: Humidity -->
          <div class="detail-card card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            </div>
            <div class="card-data">
              <span class="card-label">Humidity</span>
              <span id="humidity" class="card-value">--</span>
            </div>
          </div>
          <!-- Card 3: Wind -->
          <div class="detail-card card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
            </div>
            <div class="card-data">
              <span class="card-label">Wind Speed</span>
              <span id="wind-speed" class="card-value">--</span>
            </div>
          </div>
          <!-- Card 4: UV Index -->
          <div class="detail-card card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </div>
            <div class="card-data">
              <span class="card-label">UV Index</span>
              <span id="uv-index" class="card-value">--</span>
            </div>
          </div>
          <!-- Card 5: Pressure -->
          <div class="detail-card card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
            <div class="card-data">
              <span class="card-label">Air Pressure</span>
              <span id="pressure" class="card-value">--</span>
            </div>
          </div>
          <!-- Card 6: Sunrise/Sunset -->
          <div class="detail-card card">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 18a5 5 0 0 0-10 0M12 2v7M4.93 4.93l4.24 4.24M19.07 4.93l-4.24 4.24"/></svg>
            </div>
            <div class="card-data">
              <span class="card-label">Sunrise / Sunset</span>
              <span id="sun-times" class="card-value">--</span>
            </div>
          </div>
        </div>

        <!-- Hourly Forecast Slider -->
        <div class="hourly-forecast-section card">
          <h3>Hourly Forecast</h3>
          <div class="hourly-scroll-container">
            <div id="hourly-list" class="hourly-list">
              <!-- Dynamically populated hourly cards -->
              <div class="skeleton-glow skeleton-hourly"></div>
              <div class="skeleton-glow skeleton-hourly"></div>
              <div class="skeleton-glow skeleton-hourly"></div>
              <div class="skeleton-glow skeleton-hourly"></div>
              <div class="skeleton-glow skeleton-hourly"></div>
              <div class="skeleton-glow skeleton-hourly"></div>
            </div>
          </div>
        </div>

        <!-- Trend Graph Card -->
        <div class="trend-chart-section card">
          <h3>Temperature & Rain Trend</h3>
          <div class="chart-container">
            <svg id="trend-svg" class="trend-svg" viewBox="0 0 600 220" preserveAspectRatio="none">
              <!-- Dynamically rendered SVG paths -->
            </svg>
            <div id="chart-tooltip" class="chart-tooltip hidden"></div>
          </div>
        </div>

      </section>

      <!-- Right Column: Sidebar (Favorites & 7-Day Forecast) -->
      <aside class="sidebar-panel">
        
        <!-- Favorites Pinned Section -->
        <div class="favorites-section card">
          <h3>Pinned Locations</h3>
          <div id="favorites-list" class="favorites-list">
            <p class="empty-favorites-msg">No pinned locations yet.</p>
          </div>
        </div>

        <!-- 7-Day Forecast Section -->
        <div class="daily-forecast-section card">
          <h3>7-Day Forecast</h3>
          <div id="daily-list" class="daily-list">
            <!-- Dynamically populated daily items -->
            <div class="skeleton-glow skeleton-daily"></div>
            <div class="skeleton-glow skeleton-daily"></div>
            <div class="skeleton-glow skeleton-daily"></div>
            <div class="skeleton-glow skeleton-daily"></div>
            <div class="skeleton-glow skeleton-daily"></div>
          </div>
        </div>

      </aside>

    </main>
    

  </div>

  <!-- JavaScript Modules -->
  <script src="app.js" type="module"></script>
</body>
</html>
